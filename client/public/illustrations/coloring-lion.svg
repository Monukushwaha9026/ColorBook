<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <!-- White Background & Frame -->
  <rect width="400" height="560" rx="16" fill="#ffffff" stroke="#1f2937" stroke-width="4"/>

  <g fill="#ffffff" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Jungle Leaves at Top -->
    <path d="M 20 20 Q 60 70 30 110 Q 80 80 90 20" fill="#ffffff" stroke-width="3" />
    <line x1="35" y1="50" x2="65" y2="70" stroke-width="2" />
    <path d="M 380 20 Q 340 70 370 110 Q 320 80 310 20" fill="#ffffff" stroke-width="3" />
    <line x1="365" y1="50" x2="335" y2="70" stroke-width="2" />

    <!-- Butterfly fluttering -->
    <path d="M 310 130 C 330 110 345 130 330 145 C 345 160 330 180 310 160 C 310 160 310 130 310 130 Z" fill="#ffffff" stroke-width="3" />
    <path d="M 310 130 C 290 110 275 130 290 145 C 275 160 290 180 310 160 Z" fill="#ffffff" stroke-width="3" />
    <line x1="310" y1="125" x2="310" y2="165" stroke-width="3" />

    <!-- Friendly Baby Lion -->
    <!-- Mane (fluffy outer cloud circle) -->
    <path d="M 200 130 
      C 220 110, 250 120, 260 140 
      C 285 135, 305 160, 295 185 
      C 320 195, 325 225, 310 250 
      C 325 275, 305 310, 280 315 
      C 285 340, 255 365, 230 355 
      C 215 375, 185 375, 170 355 
      C 145 365, 115 340, 120 315 
      C 95 310, 75 275, 90 250 
      C 75 225, 80 195, 105 185 
      C 95 160, 115 135, 140 140 
      C 150 120, 180 110, 200 130 Z" fill="#ffffff" stroke-width="4" />

    <!-- Ears -->
    <circle cx="145" cy="170" r="22" fill="#ffffff" stroke-width="3" />
    <circle cx="145" cy="170" r="12" fill="#ffffff" stroke-width="2.5" />
    <circle cx="255" cy="170" r="22" fill="#ffffff" stroke-width="3" />
    <circle cx="255" cy="170" r="12" fill="#ffffff" stroke-width="2.5" />

    <!-- Face Circle -->
    <circle cx="200" cy="235" r="70" fill="#ffffff" stroke-width="4" />

    <!-- Eyes -->
    <circle cx="175" cy="225" r="14" fill="#1f2937" />
    <circle cx="171" cy="221" r="4.5" fill="#ffffff" />
    <circle cx="225" cy="225" r="14" fill="#1f2937" />
    <circle cx="221" cy="221" r="4.5" fill="#ffffff" />

    <!-- Cute Nose & Muzzle -->
    <path d="M 190 250 Q 200 242 210 250 Q 200 262 190 250 Z" fill="#1f2937" stroke-width="2" />
    <line x1="200" y1="258" x2="200" y2="272" stroke-width="3" />
    <path d="M 185 272 Q 200 282 215 272" fill="none" stroke-width="3" />
    <!-- Whiskers -->
    <line x1="150" y1="262" x2="125" y2="258" stroke-width="2.5" />
    <line x1="150" y1="272" x2="120" y2="275" stroke-width="2.5" />
    <line x1="250" y1="262" x2="275" y2="258" stroke-width="2.5" />
    <line x1="250" y1="272" x2="280" y2="275" stroke-width="2.5" />

    <!-- Lion Body (Sitting) -->
    <path d="M 155 330 C 140 370 130 420 135 460 L 265 460 C 270 420 260 370 245 330" fill="#ffffff" stroke-width="4" />

    <!-- Paws in Front -->
    <!-- Left Paw -->
    <rect x="150" y="380" width="38" height="90" rx="19" fill="#ffffff" stroke-width="3.5" />
    <line x1="162" y1="455" x2="162" y2="470" stroke-width="2.5" />
    <line x1="175" y1="455" x2="175" y2="470" stroke-width="2.5" />

    <!-- Right Paw -->
    <rect x="212" y="380" width="38" height="90" rx="19" fill="#ffffff" stroke-width="3.5" />
    <line x1="224" y1="455" x2="224" y2="470" stroke-width="2.5" />
    <line x1="237" y1="455" x2="237" y2="470" stroke-width="2.5" />

    <!-- Back Paws (Sitting sides) -->
    <ellipse cx="125" cy="460" rx="28" ry="16" fill="#ffffff" stroke-width="3" />
    <ellipse cx="275" cy="460" rx="28" ry="16" fill="#ffffff" stroke-width="3" />

    <!-- Tail with fluffy puff -->
    <path d="M 265 440 C 310 440 335 390 315 360" fill="none" stroke-width="4" />
    <path d="M 315 360 C 325 340 305 340 300 350 C 295 340 280 350 285 365 C 285 375 305 375 315 360 Z" fill="#ffffff" stroke-width="3" />

    <!-- Grass and Flowers ground -->
    <line x1="20" y1="480" x2="380" y2="480" stroke-width="4" />
    <!-- Grass blades -->
    <path d="M 50 480 L 55 455 L 62 480" fill="none" stroke-width="3" />
    <path d="M 80 480 L 85 450 L 92 480" fill="none" stroke-width="3" />
    <path d="M 320 480 L 325 455 L 332 480" fill="none" stroke-width="3" />
    <path d="M 345 480 L 350 448 L 358 480" fill="none" stroke-width="3" />
    <!-- Daisy Flower -->
    <circle cx="70" cy="515" r="8" fill="#ffffff" stroke-width="2.5" />
    <circle cx="70" cy="515" r="3" fill="#1f2937" />
  </g>
</svg>
