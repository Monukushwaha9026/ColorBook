<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <!-- Background border -->
  <rect width="400" height="560" rx="16" fill="#ffffff" stroke="#1f2937" stroke-width="4"/>

  <!-- Rainbow & Clouds in Sky -->
  <g fill="#ffffff" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 50 170 A 150 150 0 0 1 350 170" fill="none" stroke-width="3" />
    <path d="M 70 170 A 130 130 0 0 1 330 170" fill="none" stroke-width="3" />
    <path d="M 90 170 A 110 110 0 0 1 310 170" fill="none" stroke-width="3" />

    <!-- Clouds -->
    <path d="M 20 180 Q 40 150 65 165 Q 90 155 105 175 Q 120 190 100 205 Q 80 210 40 205 Q 10 200 20 180 Z" fill="#ffffff" stroke-width="3" />
    <path d="M 295 180 Q 315 150 340 165 Q 365 155 380 175 Q 395 190 375 205 Q 355 210 315 205 Q 285 200 295 180 Z" fill="#ffffff" stroke-width="3" />
    <!-- Friendly Dragon flying high -->
    <path d="M 70 90 Q 95 80 110 95 Q 125 100 115 115 Q 100 120 85 110 Q 65 115 55 100 Q 55 85 70 90 Z" fill="#ffffff" stroke-width="3" />
    <path d="M 85 92 Q 95 65 105 85" fill="#ffffff" stroke-width="2.5" />
    <circle cx="102" cy="94" r="2.5" fill="#1f2937" />

    <!-- Castle Hill -->
    <path d="M 20 480 Q 200 420 380 480 L 380 545 L 20 545 Z" fill="#ffffff" stroke-width="4" />
    <!-- Flowers on hill -->
    <circle cx="80" cy="490" r="6" fill="#ffffff" stroke-width="2" />
    <circle cx="80" cy="490" r="2" fill="#1f2937" />
    <circle cx="320" cy="495" r="6" fill="#ffffff" stroke-width="2" />
    <circle cx="320" cy="495" r="2" fill="#1f2937" />

    <!-- Main Castle Structure -->
    <!-- Left Tower -->
    <rect x="75" y="270" width="55" height="170" rx="4" fill="#ffffff" stroke-width="4" />
    <!-- Tower Roof Cone -->
    <path d="M 65 270 L 102 180 L 140 270 Z" fill="#ffffff" stroke-width="4" />
    <!-- Flag -->
    <line x1="102" y1="180" x2="102" y2="155" stroke-width="3" />
    <path d="M 102 155 L 125 165 L 102 175 Z" fill="#ffffff" stroke-width="3" />
    <!-- Tower window -->
    <path d="M 90 320 Q 102 305 115 320 L 115 350 L 90 350 Z" fill="#ffffff" stroke-width="3" />

    <!-- Right Tower -->
    <rect x="270" y="270" width="55" height="170" rx="4" fill="#ffffff" stroke-width="4" />
    <!-- Tower Roof Cone -->
    <path d="M 260 270 L 297 180 L 335 270 Z" fill="#ffffff" stroke-width="4" />
    <!-- Flag -->
    <line x1="297" y1="180" x2="297" y2="155" stroke-width="3" />
    <path d="M 297 155 L 320 165 L 297 175 Z" fill="#ffffff" stroke-width="3" />
    <!-- Tower window -->
    <path d="M 285 320 Q 297 305 310 320 L 310 350 L 285 350 Z" fill="#ffffff" stroke-width="3" />

    <!-- Central Keep / Wall -->
    <rect x="130" y="290" width="140" height="160" fill="#ffffff" stroke-width="4" />
    <!-- Battlements -->
    <path d="M 130 290 L 130 275 L 145 275 L 145 290 L 160 290 L 160 275 L 175 275 L 175 290 L 190 290 L 190 275 L 205 275 L 205 290 L 220 290 L 220 275 L 235 275 L 235 290 L 250 290 L 250 275 L 270 275 L 270 290" fill="#ffffff" stroke-width="3" />

    <!-- Center Grand Tower -->
    <rect x="165" y="210" width="70" height="80" fill="#ffffff" stroke-width="4" />
    <!-- Center Roof -->
    <path d="M 155 210 L 200 130 L 245 210 Z" fill="#ffffff" stroke-width="4" />
    <!-- Tall Flag -->
    <line x1="200" y1="130" x2="200" y2="100" stroke-width="3" />
    <path d="M 200 100 L 230 112 L 200 124 Z" fill="#ffffff" stroke-width="3" />
    <!-- Center Window -->
    <circle cx="200" cy="245" r="14" fill="#ffffff" stroke-width="3" />
    <line x1="200" y1="231" x2="200" y2="259" stroke-width="2" />
    <line x1="186" y1="245" x2="214" y2="245" stroke-width="2" />

    <!-- Castle Gate / Arched Doorway -->
    <path d="M 170 450 L 170 370 Q 200 340 230 370 L 230 450 Z" fill="#ffffff" stroke-width="4" />
    <line x1="200" y1="355" x2="200" y2="450" stroke-width="3" />
    <circle cx="188" cy="410" r="4" fill="#1f2937" />
    <circle cx="212" cy="410" r="4" fill="#1f2937" />

    <!-- Stone texture details -->
    <rect x="145" y="320" width="18" height="10" rx="2" fill="none" stroke-width="2" />
    <rect x="238" y="325" width="20" height="10" rx="2" fill="none" stroke-width="2" />
    <rect x="150" y="380" width="14" height="8" rx="2" fill="none" stroke-width="2" />
    <rect x="236" y="390" width="16" height="8" rx="2" fill="none" stroke-width="2" />
    <rect x="95" y="380" width="16" height="8" rx="2" fill="none" stroke-width="2" />
    <rect x="290" y="380" width="16" height="8" rx="2" fill="none" stroke-width="2" />
  </g>
</svg>
