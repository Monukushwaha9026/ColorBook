<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <!-- White Background & Frame -->
  <rect width="400" height="560" rx="16" fill="#ffffff" stroke="#1f2937" stroke-width="4"/>

  <g fill="#ffffff" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Saturn Planet in background -->
    <circle cx="85" cy="110" r="32" fill="#ffffff" stroke-width="3.5" />
    <!-- Planetary rings -->
    <ellipse cx="85" cy="110" rx="60" ry="16" fill="none" stroke-width="3.5" transform="rotate(-20 85 110)" />
    <!-- Craters -->
    <circle cx="80" cy="98" r="5" fill="none" stroke-width="2" />
    <circle cx="95" cy="120" r="7" fill="none" stroke-width="2" />

    <!-- Constellations and Stars -->
    <path d="M 330 80 L 335 92 L 348 92 L 338 100 L 342 112 L 330 104 L 318 112 L 322 100 L 312 92 L 325 92 Z" fill="#ffffff" stroke-width="2.5" />
    <path d="M 50 250 L 53 258 L 62 258 L 55 264 L 58 272 L 50 266 L 42 272 L 45 264 L 38 258 L 47 258 Z" fill="#ffffff" stroke-width="2" />
    <path d="M 340 320 L 343 328 L 352 328 L 345 334 L 348 342 L 340 336 L 332 342 L 335 334 L 328 328 L 337 328 Z" fill="#ffffff" stroke-width="2" />
    <circle cx="310" cy="160" r="4" fill="#ffffff" stroke-width="2" />
    <circle cx="280" cy="110" r="3" fill="#ffffff" stroke-width="2" />
    <circle cx="70" cy="330" r="3" fill="#ffffff" stroke-width="2" />

    <!-- Flying Saucer UFO -->
    <!-- Glass Dome -->
    <path d="M 140 210 C 140 145 260 145 260 210 Z" fill="#ffffff" stroke-width="4" />
    <!-- Cute Alien Inside Dome -->
    <ellipse cx="200" cy="188" rx="22" ry="18" fill="#ffffff" stroke-width="3" />
    <!-- Antenna on alien -->
    <line x1="200" y1="170" x2="200" y2="155" stroke-width="2.5" />
    <circle cx="200" cy="152" r="4" fill="#ffffff" stroke-width="2.5" />
    <!-- Big Alien Eyes -->
    <ellipse cx="190" cy="186" rx="6" ry="8" fill="#1f2937" />
    <circle cx="188" cy="183" r="2" fill="#ffffff" />
    <ellipse cx="210" cy="186" rx="6" ry="8" fill="#1f2937" />
    <circle cx="208" cy="183" r="2" fill="#ffffff" />
    <!-- Smile -->
    <path d="M 195 198 Q 200 203 205 198" fill="none" stroke-width="2.5" />

    <!-- Saucer Upper Ring -->
    <ellipse cx="200" cy="215" rx="125" ry="32" fill="#ffffff" stroke-width="4" />
    <!-- Saucer Lower Hull -->
    <path d="M 100 225 C 120 265 280 265 300 225" fill="#ffffff" stroke-width="4" />
    <!-- Saucer Lights -->
    <circle cx="120" cy="225" r="7" fill="#ffffff" stroke-width="3" />
    <circle cx="152" cy="235" r="7" fill="#ffffff" stroke-width="3" />
    <circle cx="200" cy="238" r="8" fill="#ffffff" stroke-width="3" />
    <circle cx="248" cy="235" r="7" fill="#ffffff" stroke-width="3" />
    <circle cx="280" cy="225" r="7" fill="#ffffff" stroke-width="3" />

    <!-- Tractor Beam (Tractor ray beam) -->
    <path d="M 160 258 L 90 470 L 310 470 L 240 258" fill="#ffffff" stroke-width="3.5" stroke-dasharray="8 6" />
    <!-- Beam energy rings -->
    <ellipse cx="200" cy="320" rx="45" ry="12" fill="none" stroke-width="2.5" stroke-dasharray="4 4" />
    <ellipse cx="200" cy="390" rx="75" ry="18" fill="none" stroke-width="2.5" stroke-dasharray="4 4" />
    <ellipse cx="200" cy="460" rx="100" ry="22" fill="none" stroke-width="3" />

    <!-- Floating Cow or Astronaut in Beam -->
    <ellipse cx="200" cy="360" rx="20" ry="14" fill="#ffffff" stroke-width="3" />
    <circle cx="218" cy="354" r="9" fill="#ffffff" stroke-width="2.5" />
    <circle cx="221" cy="352" r="2" fill="#1f2937" />
    <line x1="190" y1="374" x2="186" y2="390" stroke-width="3" />
    <line x1="198" y1="374" x2="198" y2="390" stroke-width="3" />
    <line x1="206" y1="374" x2="208" y2="390" stroke-width="3" />
    <!-- Spots -->
    <circle cx="195" cy="360" r="4" fill="#1f2937" />
    <circle cx="205" cy="365" r="3" fill="#1f2937" />

    <!-- Moon surface at bottom -->
    <path d="M 20 485 Q 200 450 380 485 L 380 545 L 20 545 Z" fill="#ffffff" stroke-width="4" />
    <ellipse cx="70" cy="510" rx="22" ry="8" fill="none" stroke-width="2.5" />
    <ellipse cx="320" cy="515" rx="30" ry="10" fill="none" stroke-width="2.5" />
    <ellipse cx="180" cy="525" rx="18" ry="6" fill="none" stroke-width="2" />
  </g>
</svg>
