services:
  - type: web
    name: colorbook-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate --schema=./prisma/schema.prisma && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://colorbook-ai.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.5-flash-lite
      - key: IMAGE_PROVIDER
        value: huggingface
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HUGGINGFACE_MODEL
        value: black-forest-labs/FLUX.1-schnell
      - key: IMAGE_STORAGE
        value: local
      - key: LOCAL_IMAGE_STORAGE_PATH
        value: ./storage/images
      - key: DISABLE_RATE_LIMIT
        value: "false"
      - key: IMAGE_GENERATION_CONCURRENCY
        value: "1"
      - key: MAX_IMAGE_GENERATION_ATTEMPTS
        value: "3"
      - key: CLEANUP_ENABLED
        value: "true"
      - key: CLEANUP_TIMEZONE
        value: Asia/Kolkata
      - key: CLEANUP_CRON_SCHEDULE
        value: "0 1 * * *"
      # Optional: Connect your Render PostgreSQL database URL or Supabase/Neon connection string here
      - key: DATABASE_URL
        sync: false
